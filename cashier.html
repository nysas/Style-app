<!DOCTYPE html>
<html>

<head>
<title>Cashier Coupon Panel</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>

body{
font-family: Arial;
text-align:center;
background:#f5f5f5;
padding:40px;
}

.container{
background:white;
padding:30px;
border-radius:10px;
width:400px;
margin:auto;
box-shadow:0px 0px 10px rgba(0,0,0,0.2);
}

button{
padding:10px 20px;
margin:10px;
font-size:16px;
cursor:pointer;
}

input{
padding:8px;
font-size:16px;
margin:10px;
}

.valid{
color:green;
font-weight:bold;
}

.invalid{
color:red;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h2>Cashier Coupon System</h2>

<button onclick="startScanner()">Scan QR Code</button>

<div id="reader" style="width:300px;margin:auto;"></div>

<h3>Coupon Code: <span id="couponCode">None</span></h3>

<button onclick="verifyCoupon()">Verify Coupon</button>

<p id="status"></p>

<hr>

<h3>Enter Bill Amount</h3>

<input type="number" id="bill" placeholder="Bill Amount">

<br>

<button onclick="calculateBill()">Calculate Final Bill</button>

<h3 id="result"></h3>

</div>

<script>

let coupon="";
let discount=0;
let type="";

function startScanner(){

const scanner = new Html5QrcodeScanner(
"reader",
{fps:10,qrbox:250}
);

scanner.render((decodedText)=>{

coupon=decodedText;
document.getElementById("couponCode").innerText=coupon;

scanner.clear();

});

}

async function verifyCoupon(){

const response=await fetch("http://localhost:5000/verify-coupon",{

method:"POST",
headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
couponCode:coupon
})

});

const data=await response.json();

if(data.valid){

discount=data.discount;
type=data.type;

document.getElementById("status").innerHTML=
"<span class='valid'>Valid Coupon - "+discount+" "+type+"</span>";

}
else{

document.getElementById("status").innerHTML=
"<span class='invalid'>Invalid Coupon</span>";

}

}

function calculateBill(){

let bill=document.getElementById("bill").value;
let final=bill;

if(discount>0){

if(type==="percentage"){

final=bill-(bill*discount/100);

}

else{

final=bill-discount;

}

}

document.getElementById("result").innerHTML=
"Final Amount: ₹"+final;

}

</script>

</body>
</html>
